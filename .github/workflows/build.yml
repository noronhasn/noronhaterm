name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx electron-builder --win --publish never
      # instalador e versão portátil em downloads separados (cada um com ~80 MB, em vez de um zip de 160 MB)
      - uses: actions/upload-artifact@v4
        with:
          name: netdeck-windows-instalador
          path: dist/*Setup*.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: netdeck-windows-portatil
          path: |
            dist/NetDeck*.exe
            !dist/*Setup*.exe
          compression-level: 0

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: netdeck-linux
          path: |
            dist/*.AppImage
            dist/*.deb
