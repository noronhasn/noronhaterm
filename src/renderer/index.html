<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>NetDeck</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="rainBg" class="rain rain-bg"></canvas>
  <!-- Tela de desbloqueio -->
  <div id="lock" class="lock">
    <canvas class="rain"></canvas>
    <form id="lockForm" class="lock-card" autocomplete="off">
      <div class="logo">⌁ NetDeck <span class="ver" data-ver></span></div>
      <p class="muted" id="lockHint">Escolha o usuário e digite a senha.</p>
      <label>Usuário
        <select id="lockUser"></select>
        <input id="lockNewUser" placeholder="nome do novo usuário" hidden>
      </label>
      <label>Senha
        <input id="lockPass" type="password" autofocus>
      </label>
      <label id="lockPass2Wrap" hidden>Confirmar senha
        <input id="lockPass2" type="password">
      </label>
      <label id="lockRememberWrap" class="check" hidden><input id="lockRemember" type="checkbox"> Lembrar neste computador (abrir direto, sem pedir senha)</label>
      <div id="lockError" class="error"></div>
      <button class="primary" type="submit" id="lockSubmit">Desbloquear</button>
      <button type="button" class="link" id="lockToggle">Criar novo usuário</button>
    </form>
  </div>

  <!-- Aplicação -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="side-head">
        <input id="search" type="search" placeholder="Buscar hosts, IP, tag…">
      </div>
      <div class="side-actions">
        <button id="btnNewHost" title="Novo host">＋ Host</button>
        <button id="btnNewFolder" title="Nova pasta">＋ Pasta</button>
        <button id="btnVault" title="Usuários e chaves SSH">🔑 User SSH</button>
      </div>
      <div id="tree" class="tree"></div>
      <div class="side-foot">
        <span id="whoami" class="muted"></span>
        <span>
          <button id="btnMore" title="Mais opções">⋯</button>
          <button id="btnFont" title="Fonte do terminal">Aa</button>
          <button id="btnIdle" title="Tempo para bloquear o cofre por inatividade">⏱</button>
          <button id="btnLock" title="Bloquear">🔒</button>
        </span>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div id="tabs" class="tabs"></div>
        <form id="quick" class="quick"><input id="quickInput" placeholder="Conexão rápida: user@host:22 · telnet://host"></form>
        <button id="btnBroadcast" title="Enviar o que você digitar para TODAS as abas abertas">Multi-exec</button>
        <button id="btnSplitH" title="Dividir lado a lado: escolhe o host (Ctrl+Shift+D divide com o mesmo host)">◫</button>
        <button id="btnSplitV" title="Dividir empilhado: escolhe o host (Ctrl+Shift+E divide com o mesmo host)">⬒</button>
        <button id="btnSftp" title="Navegador SFTP da aba atual">SFTP</button>
        <button id="btnReconnect" title="Reconectar a aba atual">↻</button>
      </div>
      <div id="terms" class="terms">
        <div id="empty" class="empty">
          <canvas class="rain"></canvas>
          <div class="logo big">⌁ NetDeck</div>
          <div class="muted ver" data-ver></div>
          <p>Dê duplo clique em um host, ou use a conexão rápida acima.</p>
        </div>
      </div>
      <div id="status" class="status"></div>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="layout.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
